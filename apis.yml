name: ClearCare
description: >-
  ClearCare (originally ClearCare Online) is a web-based home care agency
  management platform founded in 2011 and headquartered in San Francisco.
  It provides non-medical home care agencies with back-office and point-of-care
  tooling: caregiver scheduling, telephony-based clock-in/clock-out and
  electronic visit verification (EVV), billing and payroll, client and caregiver
  management, care planning, a family room portal, and business analytics.
  ClearCare was backed by Battery Ventures and Cendana Capital and was acquired
  by WellSky (formerly Mediware) in 2019; the product is now marketed as WellSky
  Personal Care, and the clearcareonline.com domain redirects to WellSky. This
  profile was surfaced as a Battery Ventures portfolio company and enriched as a
  historical company record — ClearCare no longer operates a standalone public
  developer or API program.
